<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120">
  <defs>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Infinity loop (representing endless cycle of tech turnover) -->
  <g transform="translate(5, 10)">
    <path d="M40 50 C40 20, 75 20, 80 50 C85 80, 120 80, 120 50 C120 20, 85 20, 80 50 C75 80, 40 80, 40 50Z"
          fill="none" stroke="url(#teal)" stroke-width="6" stroke-linecap="round"/>

    <!-- Left loop: old phone icon -->
    <g transform="translate(55, 42)" fill="none" stroke="#ecf0f1" stroke-width="1.5" opacity="0.85">
      <rect x="0" y="0" width="10" height="16" rx="1.5"/>
      <line x1="3" y1="14" x2="7" y2="14"/>
    </g>

    <!-- Right loop: new laptop icon -->
    <g transform="translate(92, 43)" fill="none" stroke="#ecf0f1" stroke-width="1.5" opacity="0.85">
      <rect x="0" y="0" width="16" height="11" rx="1.5"/>
      <line x1="-2" y1="13" x2="18" y2="13" stroke-linecap="round"/>
    </g>

    <!-- Arrow on top crossing point (left to right flow) -->
    <polygon points="83,38 88,42 83,46" fill="#ecf0f1" opacity="0.8"/>

    <!-- Downward leaf / eco touch near bottom -->
    <g transform="translate(80, 94)" opacity="0.85">
      <path d="M0 0 Q6 -9 0 -16 Q-6 -9 0 0Z" fill="#a8edea"/>
      <line x1="0" y1="-2" x2="0" y2="-12" stroke="#ecf0f1" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Title text on the right -->
  <text x="155" y="52" text-anchor="start" font-family="'Segoe UI', Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ecf0f1" letter-spacing="4">TECH</text>
  <text x="155" y="82" text-anchor="start" font-family="'Segoe UI', Helvetica, sans-serif" font-size="18" font-weight="400" fill="#a8edea" letter-spacing="3" opacity="0.85">TURNOVER</text>
</svg>
