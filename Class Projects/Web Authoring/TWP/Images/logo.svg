<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c3e50;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad)" />

  <!-- Circular arrow (refresh/cycle motif) -->
  <path d="M100 40 a60 60 0 1 1 -52 30" fill="none" stroke="#ecf0f1" stroke-width="7" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <polygon points="40,66 56,74 50,58" fill="#ecf0f1"/>

  <!-- Circuit-board traces radiating from center -->
  <g stroke="#ecf0f1" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <line x1="100" y1="100" x2="100" y2="70"/>
    <line x1="100" y1="70" x2="120" y2="70"/>
    <circle cx="120" cy="70" r="3" fill="#ecf0f1"/>

    <line x1="100" y1="100" x2="130" y2="100"/>
    <line x1="130" y1="100" x2="130" y2="120"/>
    <circle cx="130" cy="120" r="3" fill="#ecf0f1"/>

    <line x1="100" y1="100" x2="100" y2="130"/>
    <line x1="100" y1="130" x2="80" y2="130"/>
    <circle cx="80" cy="130" r="3" fill="#ecf0f1"/>

    <line x1="100" y1="100" x2="75" y2="100"/>
    <line x1="75" y1="100" x2="75" y2="85"/>
    <circle cx="75" cy="85" r="3" fill="#ecf0f1"/>
  </g>

  <!-- Center node -->
  <circle cx="100" cy="100" r="8" fill="#ecf0f1"/>
  <circle cx="100" cy="100" r="4" fill="#3498db"/>

  <!-- Subtitle -->
  <text x="100" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#ecf0f1" letter-spacing="1.5" opacity="0.85">TECH TURNOVER</text>
</svg>
