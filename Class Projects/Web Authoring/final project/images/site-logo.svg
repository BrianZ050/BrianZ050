<svg xmlns="http://www.w3.org/2000/svg" width="240" height="72" viewBox="0 0 240 72" role="img" aria-labelledby="title desc">
  <title id="title">RDS Lab Logo</title>
  <desc id="desc">Rounded badge logo for Rutgers Digital Safety Lab with shield icon and text.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1720" />
      <stop offset="100%" stop-color="#1d2b3a" />
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4dd2a8" />
      <stop offset="100%" stop-color="#2ea283" />
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="237" height="69" rx="14" fill="url(#bg)" stroke="#2b3a4a" stroke-width="3" />

  <g transform="translate(14 12)">
    <path d="M22 0 L40 8 L40 24 C40 35 32 44 22 48 C12 44 4 35 4 24 L4 8 Z" fill="url(#shield)" />
    <path d="M22 10 L30 14 L30 23 C30 29 26 34 22 36 C18 34 14 29 14 23 L14 14 Z" fill="#0f1720" opacity="0.9" />
    <circle cx="22" cy="22" r="3" fill="#4dd2a8" />
  </g>

  <text x="66" y="31" fill="#e9f0f6" font-family="Trebuchet MS, Segoe UI, Tahoma, sans-serif" font-size="23" font-weight="700" letter-spacing="0.5">RDS Lab</text>
  <text x="66" y="49" fill="#a6b8c8" font-family="Trebuchet MS, Segoe UI, Tahoma, sans-serif" font-size="11" letter-spacing="1">DIGITAL SAFETY</text>
</svg>
